<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nice Writing</title>
  <meta name="description" content="Freelance writer and editor for nonprofits, NGOs, and foundations." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <nav id="nav">
    <a href="#home" class="nav-logo">
      <img src="assets/logo.png" alt="Nice Writing" />
    </a>
    <ul class="nav-links" id="nav-links">
      <li><a href="#home">Home</a></li>
      <li><a href="#about">About</a></li>
      <li><a href="#work">Work</a></li>
      <li><a href="#contact">Contact</a></li>
    </ul>
    <button class="nav-toggle" id="nav-toggle" aria-label="Toggle navigation">
      <span></span><span></span>
    </button>
  </nav>

  <section id="home">
    <div class="hero-inner">
      <span class="eyebrow" id="hero-eyebrow"></span>
      <h1 class="hero-headline" id="hero-headline"></h1>
      <p class="hero-sub" id="hero-sub"></p>
      <a href="#work" class="btn"><span id="hero-cta-text">View Work</span></a>
    </div>
    <div class="hero-scroll-hint">
      <span>Scroll</span>
      <div class="scroll-line"></div>
    </div>
  </section>

  <section id="about">
    <div class="section-inner">
      <div class="about-grid">
        <div class="about-left">
          <span class="label">About</span>
          <h2 class="section-heading reveal" id="about-heading"></h2>
        </div>
        <div class="about-right reveal">
          <div id="about-body"></div>
          <div class="tag-cloud" id="about-tags"></div>
        </div>
      </div>
    </div>
  </section>

  <section id="work">
    <div class="section-inner">
      <div class="work-header">
        <span class="label">Work</span>
        <div class="filters" id="work-filters"></div>
      </div>
      <div class="work-list" id="work-list">
        <div class="loading-row">Loading…</div>
      </div>
    </div>
  </section>

  <section id="contact">
    <div class="section-inner">
      <div class="contact-grid">
        <div class="contact-left reveal">
          <span class="label">Contact</span>
          <h2 class="section-heading" id="contact-heading"></h2>
          <p class="contact-sub" id="contact-sub"></p>
        </div>
        <div class="contact-right reveal" id="contact-links"></div>
      </div>
    </div>
  </section>

  <footer>
    <p id="footer-text"></p>
    <a href="admin.html" class="admin-footer-link">Admin</a>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="main.js"></script>
</body>
</html>
