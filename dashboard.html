<!DOCTYPE html>
<html lang="en">
<head>
  <!-- AUTH GUARD — runs before anything renders -->
  <script src="config.js"></script>
<script>
  (function() {
    var stored = localStorage.getItem('nw-pw');
    if (stored === ADMIN_PASSWORD) return;
    var attempt = window.prompt('Enter admin password:');
    if (attempt === ADMIN_PASSWORD) {
      localStorage.setItem('nw-pw', ADMIN_PASSWORD);
    } else {
      window.location.replace('admin.html');
    }
  })();
</script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard — Nice Writing</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="admin.css" />
</head>
<body>

  <header class="topbar">
    <img src="assets/logo.png" alt="Nice Writing" class="topbar-logo" />
    <nav class="tab-nav">
      <button class="tab-btn active" data-tab="work">Work</button>
      <button class="tab-btn" data-tab="about">About</button>
      <button class="tab-btn" data-tab="hero">Homepage</button>
      <button class="tab-btn" data-tab="contact">Contact</button>
    </nav>
    <button class="btn-ghost" id="logout-btn">Log out</button>
  </header>

  <!-- WORK TAB -->
  <div class="tab-panel" id="tab-work">
    <div class="panel-head">
      <h2>Work</h2>
      <button class="btn-primary" id="add-work-btn">+ Add Piece</button>
    </div>
    <div class="work-table" id="admin-work-list">
      <div class="table-loading">Loading…</div>
    </div>
  </div>

  <!-- ABOUT TAB -->
  <div class="tab-panel hidden" id="tab-about">
    <div class="panel-head"><h2>About</h2></div>
    <div class="form-block">
      <div class="field">
        <label>Heading</label>
        <input type="text" id="about-heading" placeholder="Writing that serves purpose." />
      </div>
      <div class="field">
        <label>Bio — Paragraph 1</label>
        <textarea id="about-p1" rows="3"></textarea>
      </div>
      <div class="field">
        <label>Bio — Paragraph 2</label>
        <textarea id="about-p2" rows="3"></textarea>
      </div>
      <div class="field">
        <label>Bio — Paragraph 3 <span class="optional">(optional)</span></label>
        <textarea id="about-p3" rows="3"></textarea>
      </div>
      <div class="field">
        <label>Skills / Tags <span class="optional">(comma-separated)</span></label>
        <input type="text" id="about-tags" placeholder="Annual Reports, Grant Narratives, Editing…" />
      </div>
      <button class="btn-primary" id="save-about-btn">Save About</button>
      <span class="save-confirm" id="about-confirm"></span>
    </div>
  </div>

  <!-- HERO TAB -->
  <div class="tab-panel hidden" id="tab-hero">
    <div class="panel-head"><h2>Homepage</h2></div>
    <div class="form-block">
      <div class="field">
        <label>Small label <span class="optional">(e.g. "Writing &amp; Editing")</span></label>
        <input type="text" id="hero-eyebrow" />
      </div>
      <div class="field">
        <label>Main Headline <span class="optional">(wrap a word in &lt;em&gt;&lt;/em&gt; to italicise)</span></label>
        <input type="text" id="hero-headline" />
      </div>
      <div class="field">
        <label>Subtitle</label>
        <textarea id="hero-sub" rows="2"></textarea>
      </div>
      <div class="field">
        <label>Button text</label>
        <input type="text" id="hero-cta" placeholder="View Work" />
      </div>
      <button class="btn-primary" id="save-hero-btn">Save Homepage</button>
      <span class="save-confirm" id="hero-confirm"></span>
    </div>
  </div>

  <!-- CONTACT TAB -->
  <div class="tab-panel hidden" id="tab-contact">
    <div class="panel-head"><h2>Contact</h2></div>
    <div class="form-block">
      <div class="field">
        <label>Heading</label>
        <input type="text" id="contact-heading" placeholder="Let's work together." />
      </div>
      <div class="field">
        <label>Body text</label>
        <textarea id="contact-body" rows="3"></textarea>
      </div>
      <div class="field-row">
        <div class="field">
          <label>Email address</label>
          <input type="email" id="contact-email" placeholder="you@email.com" />
        </div>
        <div class="field">
          <label>LinkedIn URL <span class="optional">(optional)</span></label>
          <input type="url" id="contact-linkedin" placeholder="https://linkedin.com/in/…" />
        </div>
      </div>
      <div class="field">
        <label>Location <span class="optional">(optional)</span></label>
        <input type="text" id="contact-location" placeholder="New York, NY" />
      </div>
      <button class="btn-primary" id="save-contact-btn">Save Contact</button>
      <span class="save-confirm" id="contact-confirm"></span>
    </div>
  </div>

  <!-- ADD / EDIT MODAL -->
  <div id="modal-overlay" style="display:none">
    <div class="modal">
      <div class="modal-head">
        <h3 id="modal-title">Add Piece</h3>
        <button class="modal-close" id="modal-close-btn">✕</button>
      </div>
      <div class="modal-body">
        <div class="field-row">
          <div class="field">
            <label>Title <span class="req">*</span></label>
            <input type="text" id="m-title" placeholder="Article or essay title" />
          </div>
          <div class="field" style="flex: 0 0 140px;">
            <label>Year</label>
            <input type="text" id="m-year" placeholder="2024" maxlength="4" />
          </div>
        </div>
        <div class="field-row">
          <div class="field">
            <label>Client / Publication</label>
            <input type="text" id="m-client" placeholder="Ford Foundation" />
          </div>
          <div class="field" style="flex: 0 0 200px;">
            <label>Category</label>
            <select id="m-category">
              <option>Writing</option>
              <option>Editing</option>
              <option>Content Strategy</option>
              <option>Annual Report</option>
              <option>Grant Narrative</option>
              <option>Op-Ed</option>
              <option>Longform</option>
            </select>
          </div>
        </div>
        <div class="field">
          <label>Description</label>
          <textarea id="m-description" rows="3" placeholder="One or two sentences about this piece…"></textarea>
        </div>
        <div class="attach-toggle">
          <button class="toggle-opt active" id="toggle-link-btn">🔗 Paste a Link</button>
          <button class="toggle-opt" id="toggle-file-btn">📄 Upload a File</button>
        </div>
        <div id="attach-link-area" class="field">
          <label>URL</label>
          <input type="url" id="m-link" placeholder="https://…" />
        </div>
        <div id="attach-file-area" hidden>
          <div class="drop-zone" id="drop-zone">
            <div class="drop-inner">
              <span class="drop-icon">↑</span>
              <p>Drag a file here, or <span class="drop-browse">click to browse</span></p>
              <p class="drop-hint">PDF, Word, or any document</p>
            </div>
            <p class="drop-selected" id="drop-selected"></p>
          </div>
          <input type="file" id="m-file" style="display:none;" />
          <p class="current-file" id="current-file-note"></p>
        </div>
      </div>
      <div class="modal-foot">
        <button class="btn-ghost" id="modal-cancel-btn">Cancel</button>
        <button class="btn-primary" id="modal-save-btn">Save Piece</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="admin.js"></script>
</body>
</html>
